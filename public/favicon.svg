<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGradient)" stroke="url(#borderGrad)" stroke-width="2.5" />

  <!-- Studio Microphone Capsule -->
  <rect x="24" y="14" width="16" height="23" rx="8" fill="url(#micGrad)" filter="url(#glow)" />
  
  <!-- Mic Grille Lines -->
  <line x1="27" y1="19" x2="37" y2="19" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="27" y1="24" x2="37" y2="24" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />
  <line x1="27" y1="29" x2="37" y2="29" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

  <!-- Cradle Frame -->
  <path d="M19 26 C19 39 45 39 45 26" fill="none" stroke="#e2e8f0" stroke-width="2.8" stroke-linecap="round" />

  <!-- Stem -->
  <line x1="32" y1="39" x2="32" y2="47" stroke="#e2e8f0" stroke-width="2.8" stroke-linecap="round" />

  <!-- Stand Base -->
  <line x1="22" y1="47" x2="42" y2="47" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round" />

  <!-- Active Broadcast indicator / Crown accent -->
  <circle cx="47" cy="14" r="3.5" fill="#10b981" stroke="#090d16" stroke-width="1.5" />
</svg>
